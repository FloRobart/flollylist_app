# Browsers must revalidate everything so that a release is never hidden by a stale front-end.
# Only static media can stay cached.
map $uri $cache_control_header {
    default "no-cache";
    ~*\.(?:css|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ "public, max-age=2592000";
}

# Plain HTTP is only allowed when the application itself is served from localhost (development).
map $host $local_api_sources {
    default "";
    localhost "http://localhost:*";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    server_tokens off;

    # The application is read-only: no request has a reason to carry a body
    client_max_body_size 1k;

    # Headers stay at the server level: nginx drops them from any location having its own add_header
    add_header Cache-Control $cache_control_header always;

    # connect-src lists the addresses of AUTH_URL and DATA_URL: injected code cannot send data
    # anywhere else, and changing one of these addresses requires changing it here as well
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.hollylist.florobart.fr https://api.floraccess.florobart.fr $local_api_sources; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri /index.html;
    }

    # The runtime configuration is the only hidden file meant to be served
    location = /assets/.env {
    }

    location ~ /\. {
        return 404;
    }
}
